<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Calendar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="auth-guard.js"></script>
</head>
<body>

    <div class="layout">
        <aside class="sidebar">
            <!-- Мини-календарь -->
            <section class="mini-cal">
                <div class="mini-cal-header">
                    <button class="mini-nav" id="miniPrev">‹</button>
                    <span id="miniMonth"></span>
                    <button class="mini-nav" id="miniNext">›</button>
                </div>
                <div class="mini-cal-weekdays">
                    <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span>
                </div>
                <div class="mini-cal-grid" id="miniGrid"></div>
            </section>

            <!-- Форма создания -->
            <section class="card">
                <h3 class="card-title">Новая задача</h3>
                <form class="add-form" id="addForm">
                    <input type="text" id="title" placeholder="Название" required autocomplete="off">
                    <input type="text" id="description" placeholder="Описание (необязательно)" autocomplete="off">
                    <div class="form-row">
                        <input type="date" id="deadline" title="Дата">
                        <select id="priority" title="Приоритет">
                            <option value="1">Низкий</option>
                            <option value="2" selected>Средний</option>
                            <option value="3">Высокий</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <input type="time" id="startTime" title="Начало">
                        <input type="time" id="endTime" title="Конец">
                    </div>
                    <button type="submit" class="btn-primary">Добавить</button>
                </form>
            </section>

            <!-- Глобальные задачи (без даты) -->
            <section class="card">
                <h3 class="card-title">Без даты</h3>
                <div id="globalList" class="global-list"></div>
            </section>

            <!-- Фильтры -->
            <section class="card">
                <h3 class="card-title">Приоритет</h3>
                <div class="filter-row">
                    <button class="filter-btn active" data-filter="all">Все</button>
                    <button class="filter-btn" data-filter="3">Высокий</button>
                    <button class="filter-btn" data-filter="2">Средний</button>
                    <button class="filter-btn" data-filter="1">Низкий</button>
                </div>
            </section>
        </aside>

        <main class="main">
            <div class="week-nav">
                <button class="nav-btn" id="prevWeek" title="Предыдущая неделя">‹</button>
                <h2 id="weekLabel"></h2>
                <button class="nav-btn" id="nextWeek" title="Следующая неделя">›</button>
            </div>

            <div class="week-grid" id="weekGrid"></div>
        </main>
    </div>

    <!-- Модалка редактирования -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle">Редактировать задачу</h3>
                <button class="modal-close" id="modalClose" title="Закрыть">×</button>
            </div>
            <form class="modal-form" id="modalForm">
                <input type="text" id="modalTitleInput" placeholder="Название" required autocomplete="off">
                <input type="text" id="modalDesc" placeholder="Описание (необязательно)" autocomplete="off">
                <div class="form-row">
                    <input type="date" id="modalDeadline" title="Дата">
                    <select id="modalPriority" title="Приоритет">
                        <option value="1">Низкий</option>
                        <option value="2">Средний</option>
                        <option value="3">Высокий</option>
                    </select>
                </div>
                <div class="form-row">
                    <input type="time" id="modalStart" title="Начало">
                    <input type="time" id="modalEnd" title="Конец">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-danger" id="modalDelete">Удалить</button>
                    <div class="modal-actions-right">
                        <button type="button" class="btn-secondary" id="modalToggleDone"></button>
                        <button type="submit" class="btn-primary">Сохранить</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script src="navbar.js"></script>
    <script src="app.js"></script>
</body>
</html>
