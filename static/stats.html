<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статистика — Task Calendar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="stats.css">
    <script src="auth-guard.js"></script>
</head>
<body>
    <div class="stats-layout">
        <h1 class="stats-heading">Статистика</h1>

        <!-- Главные числа -->
        <div class="stat-cards">
            <div class="stat-card">
                <span class="stat-value" id="statTotal">—</span>
                <span class="stat-label">Всего задач</span>
            </div>
            <div class="stat-card accent">
                <span class="stat-value" id="statDone">—</span>
                <span class="stat-label">Выполнено</span>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="statActive">—</span>
                <span class="stat-label">В работе</span>
            </div>
            <div class="stat-card warn">
                <span class="stat-value" id="statOverdue">—</span>
                <span class="stat-label">Просрочено</span>
            </div>
        </div>

        <!-- Прогресс-бар выполнения -->
        <section class="stat-section">
            <h2 class="stat-section-title">Прогресс</h2>
            <div class="progress-bar-wrap">
                <div class="progress-bar-track">
                    <div class="progress-bar-fill" id="progressFill"></div>
                </div>
                <span class="progress-pct" id="progressPct">0%</span>
            </div>
        </section>

        <!-- По приоритетам -->
        <section class="stat-section">
            <h2 class="stat-section-title">По приоритету</h2>
            <div class="priority-rows" id="priorityRows"></div>
        </section>

        <!-- Задачи без даты -->
        <section class="stat-section">
            <h2 class="stat-section-title">Без даты</h2>
            <p class="stat-note" id="statNoDate">—</p>
        </section>
    </div>

    <script src="navbar.js"></script>
    <script src="stats.js"></script>
</body>
</html>
