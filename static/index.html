<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Calendar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <h1>Task Calendar</h1>
        <p class="subtitle">Список задач</p>
    </header>

    <main class="container">
        <!-- Форма добавления задачи -->
        <section class="card">
            <h2>Новая задача</h2>
            <div class="form">
                <input type="text" id="title" placeholder="Название задачи" />
                <input type="text" id="description" placeholder="Описание (необязательно)" />
                <div class="form-row">
                    <select id="priority">
                        <option value="1">Низкий приоритет</option>
                        <option value="2">Средний приоритет</option>
                        <option value="3">Высокий приоритет</option>
                    </select>
                    <input type="date" id="deadline" />
                </div>
                <button id="addBtn">Добавить</button>
            </div>
        </section>

        <!-- Фильтры -->
        <section class="filters">
            <span>Фильтр:</span>
            <button class="filter-btn active" data-filter="all">Все</button>
            <button class="filter-btn" data-filter="3">Высокий</button>
            <button class="filter-btn" data-filter="2">Средний</button>
            <button class="filter-btn" data-filter="1">Низкий</button>
        </section>

        <!-- Список задач -->
        <section id="taskList" class="task-list">
            <!-- Задачи добавляются через JS -->
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
