<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Общие календари — Task Calendar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="shared.css">
    <script src="auth-guard.js"></script>
</head>
<body>
    <div class="shared-layout">
        <h1 class="shared-heading">Общие календари</h1>

        <div class="card">
            <div class="card-title">Открыты мне <span class="count-badge" id="sharedCount"></span></div>
            <div class="shared-people" id="sharedPeople"></div>
            <div class="empty hidden" id="sharedEmpty">Пока никто не открыл вам календарь</div>
        </div>

        <div class="card hidden" id="viewerCard">
            <div class="card-title" id="viewerTitle"></div>
            <div id="viewerList"></div>
            <div class="empty hidden" id="viewerEmpty">Нет задач для показа</div>
        </div>
    </div>

    <script src="navbar.js"></script>
    <script src="shared.js"></script>
</body>
</html>
